# Built-in defaults. Override these values in SD:/3ds/ros2_3ds_interface/config.ini.
# Optional physical LAN IPv4 address of a DDS peer; leave blank for multicast discovery.
peer_ip=
port=17650
send_interval_ms=1000
domain_id=0
ros_namespace=nintendo_3ds
dds_enabled=1
imu_enabled=1
camera_enabled=0
camera_source=inner
camera_resolution=qqvga
camera_fps=5
camera_jpeg_quality=70
imu_publish_hz=50
# 1 g / 512 counts converted to m/s^2.
imu_accel_mps2_per_count=0.01915361328125
